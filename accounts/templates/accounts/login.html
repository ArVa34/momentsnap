{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Log in" %} · MomentSnap{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <h1 class="h2 mb-2">{% translate "Log in" %}</h1>
      <p class="text-body-secondary mb-4">
        {% translate "New here?" %} <a href="{% url 'accounts:register' %}">{% translate "Create an account" %}</a>
      </p>
      <form method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {% include "partials/_form_fields.html" %}
        <button type="submit" class="btn btn-primary w-100">{% translate "Log in" %}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
